<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi GPLX hạng B</title>
<link rel="stylesheet" href="style.css">
<script>
  // Theme: saved choice wins; otherwise follow the system setting. Runs before paint to avoid a flash.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
  <h1>Ôn thi GPLX hạng B</h1>
  <div id="overall" class="overall"></div>
  <button id="themeBtn" class="theme-btn" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">🌓</button>
</header>
<div class="layout">
  <nav id="sidebar" class="sidebar"></nav>
  <main id="main" class="main"></main>
</div>
<script src="js/data.js"></script>
<script src="app.js"></script>
</body>
</html>
